_base_: base.yaml

benchmark:
  name: imagenet_a
  dataset_name: imagenet_a
  data_root: /path/to/datasets/imagenet-a
  scenario: class_incremental
  num_tasks: 10
  classes_per_task: 20
  image_size: 224

training:
  batch_size: 64
  epochs_per_task: 20
  lr: 0.0008

runtime:
  num_workers: 8

warmup:
  num_batches: 5

output:
  benchmark_subdir: imagenet_a
