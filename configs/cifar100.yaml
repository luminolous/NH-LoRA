_base_: base.yaml

benchmark:
  name: cifar100
  dataset_name: cifar100
  data_root: /path/to/datasets/cifar100
  scenario: class_incremental
  num_tasks: 10
  classes_per_task: 10
  image_size: 224

training:
  batch_size: 128
  epochs_per_task: 15
  lr: 0.001

runtime:
  num_workers: 8

warmup:
  num_batches: 5

output:
  benchmark_subdir: cifar100
